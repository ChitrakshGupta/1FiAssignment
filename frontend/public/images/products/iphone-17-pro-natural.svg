      <stop offset="100%" stop-color="#7D7466" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0A0A0E" />
    </linearGradient>
  </defs>
  <!-- Frame -->
